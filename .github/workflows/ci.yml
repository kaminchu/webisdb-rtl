name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format check (oxfmt)
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test (vitest)
        run: npm run test
      - name: Unused code (knip)
        run: npm run knip
