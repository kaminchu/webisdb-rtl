[package]
name = "webisdb_dsp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
threads = ["dep:wasm-bindgen", "dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-rayon = { version = "=1.3.0", optional = true }
rayon = { version = "1.12", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
